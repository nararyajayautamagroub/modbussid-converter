<!doctype html><html lang='id'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Game Mod Asset Lab</title></head><body><h1>Game Mod Asset Lab</h1><h2>Light Animation</h2><p>Strobo · Rotator · LED Bar</p><div id='app'></div><script>for(const t of ['strobo','rotator','ledbar']){const h=document.createElement('h3');h.textContent=t.toUpperCase();app.append(h);for(const p of ['bussid','roblox']){const a=document.createElement('a');a.href=`/api/lights/${t}/download?platform=${p}`;a.textContent=`Download ${p}`;a.style.margin='8px';app.append(a)}}</script></body></html>
