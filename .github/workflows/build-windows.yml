name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e .

      - name: Test
        run: python -m pytest

      - name: Build EXE
        run: python -m PyInstaller --clean --noconfirm modbussid.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: modbussid-converter-windows
          path: dist/modbussid-converter.exe
          if-no-files-found: error
